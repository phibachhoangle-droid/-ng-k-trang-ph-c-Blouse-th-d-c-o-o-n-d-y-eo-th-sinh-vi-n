<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form đăng ký đã đóng</title>
<link rel="stylesheet" href="styles.css">
<style>
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc}
.closed{max-width:680px;margin:24px;padding:42px 30px;text-align:center;background:#fff;border:1px solid #e2e8f0;border-radius:24px;box-shadow:0 18px 50px rgba(15,23,42,.08)}
.icon{width:76px;height:76px;margin:0 auto 20px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fee2e2;font-size:38px}
h1{margin:0 0 12px;font-size:30px;color:#0f172a}
p{margin:10px 0;color:#475569;line-height:1.65;font-size:16px}
.note{margin-top:24px;padding:16px;border-radius:14px;background:#f8fafc;border:1px solid #e2e8f0;color:#334155;font-weight:700}
.small{margin-top:18px;font-size:13px;color:#64748b}
</style>
</head>
<body>
<div class="closed">
  <div class="icon">🔒</div>
  <h1>FORM ĐĂNG KÝ ĐÃ ĐÓNG</h1>
  <p>Form đăng ký đồng phục & vật dụng sinh viên hiện đã tạm khóa và <strong>không tiếp nhận đăng ký mới</strong>.</p>
  <div class="note">Các đăng ký đã gửi trước đó vẫn được lưu giữ và xử lý bình thường.</div>
  <p class="small">Nếu cần chỉnh sửa hoặc bổ sung thông tin, vui lòng liên hệ Ban tổ chức.</p>
</div>
</body>
</html>
